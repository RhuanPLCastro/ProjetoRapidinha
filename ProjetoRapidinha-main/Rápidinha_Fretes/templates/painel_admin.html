{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração - RápiDinha Fretes</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=7">
</head>

<body>

    <main class="painel-admin">

        <h1>Administração</h1>

        <p>
            Defina o cargo de cada usuário do sistema.
        </p>

        <table class="tabela-admin">

            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Cargo</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody>

                {% for u in usuarios %}

                <tr>

                    <td>
                        {{ u.usuario }}
                    </td>

                    <td>

                        <form method="POST">

                            {% csrf_token %}

                            <input
                                type="hidden"
                                name="id_login"
                                value="{{ u.id_login }}"
                            >

                            <select name="cargo">

                                {% for c in cargos %}

                                    <option
                                        value="{{ c }}"
                                        {% if u.cargo == c %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ c }}
                                    </option>

                                {% endfor %}

                            </select>

                    </td>

                    <td>

                            <button
                                type="submit"
                                class="btn-salvar-admin"
                            >
                                Salvar
                            </button>

                        </form>

                    </td>

                </tr>

                {% empty %}

                <tr>
                    <td colspan="3">
                        Nenhum usuário cadastrado.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        <a
            href="{% url 'home' %}"
            class="btn-voltar-admin"
        >
            Voltar
        </a>

    </main>

</body>
</html>
