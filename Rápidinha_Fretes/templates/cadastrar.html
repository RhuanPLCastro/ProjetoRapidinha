{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - RápiDinha Fretes</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=7">
</head>

<body class="cadastro-pagina">

    <div class="container">

        <h1>Cadastro</h1>

        {% if erro and acao == 'cadastrar' %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="acao" value="cadastrar">

            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <h2>Já tenho conta</h2>

        {% if erro and acao == 'entrar' %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="acao" value="entrar">

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>
        </form>

    </div>

</body>
</html>
