{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - RápiDinha Fretes</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=8">
</head>
<style>
    .marca-login {
        margin-bottom: 22px;
        padding-bottom: 18px;
        border-bottom: 1px solid #E2E8F0;
        text-align: center;
    }

    .logo-login {
        width: 130px;
        max-width: 100%;
        display: block;
        margin: 0 auto;
    }

    .marca-login span {
        display: block;
        margin-top: 10px;
        color: #64748B;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.16em;
        text-transform: uppercase;
    }
</style>

<body class="cadastro-pagina">

    <div class="container">

        <div class="marca-login">
            <img src="{% static 'logoRD.png' %}" alt="Logo RápiDinha Fretes" class="logo-login">
            <span>Gestão de frota</span>
        </div>

        <h1>Cadastro</h1>

        {% if erro and acao == 'cadastrar' %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="acao" value="cadastrar">

            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <h2>Já tenho conta</h2>

        {% if erro and acao == 'entrar' %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="acao" value="entrar">

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>
        </form>

    </div>

</body>
</html>
